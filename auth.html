<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italy Trip 2026 - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .login-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #f1f3f5;
      text-align: center;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      color: #adb5bd;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #f1f3f5;
      font-size: 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      background: rgba(255,255,255,0.12);
      border-color: #c9a84c;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #c9a84c 0%, #b8964a 100%);
      border: none;
      border-radius: 8px;
      color: #0d1b2a;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .error {
      background: rgba(239, 83, 80, 0.15);
      border: 1px solid rgba(239, 83, 80, 0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-icon">🔒</div>
    <h1>Italy Trip 2026</h1>
    <div class="subtitle">Private Travel Companion</div>
    <div class="error" id="error">Incorrect password. Please try again.</div>
    <form id="loginForm">
      <input 
        type="password" 
        id="password" 
        placeholder="Enter password" 
        autocomplete="off"
        autofocus
      >
      <button type="submit">Access Trip</button>
    </form>
  </div>

  <script>
    // SHA-256 hash of password
    // Default password: "Italy2026Ski"
    // To change: Open set-password.html in browser, enter new password, copy hash here
    const passwordHash = 'b97204c21f2915125f0b2aeb5aa152acc68446db6bcb887eb9dba8f5e5f8f4a7';
    
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      
      // Simple hash function (not cryptographically secure, but better than plaintext)
      const hash = await simpleHash(password);
      
      if (hash === passwordHash) {
        // Store session
        sessionStorage.setItem('authenticated', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').classList.add('show');
        document.getElementById('password').value = '';
        setTimeout(() => {
          document.getElementById('error').classList.remove('show');
        }, 3000);
      }
    });

    async function simpleHash(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Check if already authenticated
    if (sessionStorage.getItem('authenticated') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
