<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Password Hash</title>
  <style>
    body { font-family: system-ui; padding: 40px; max-width: 600px; margin: 0 auto; }
    input, button { padding: 12px; font-size: 16px; margin: 10px 0; width: 100%; }
    .result { background: #f0f0f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    code { background: #fff; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>🔐 Set Your Password</h1>
  <p>Enter a password for your trip site. You'll need to share this password with your wife.</p>
  
  <input type="text" id="newPassword" placeholder="Enter your password" />
  <button onclick="generateHash()">Generate Hash</button>
  
  <div id="result" class="result" style="display:none;">
    <h3>Your Password Hash:</h3>
    <p>Copy this hash and replace the passwordHash in auth.html:</p>
    <code id="hashOutput" style="display:block; word-break:break-all;"></code>
    <p style="margin-top:20px; color:#666;">
      Password to share: <strong id="passwordDisplay"></strong>
    </p>
  </div>

  <script>
    async function generateHash() {
      const password = document.getElementById('newPassword').value;
      if (!password) {
        alert('Please enter a password');
        return;
      }
      
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      document.getElementById('hashOutput').textContent = hash;
      document.getElementById('passwordDisplay').textContent = password;
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
